services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            # host:container — exposed so you can connect from your machine too.
            - "${POSTGRES_PORT:-5432}:5432"
        healthcheck:
            # The API waits for this to pass before starting (see depends_on below),
            # so it never boots against a database that isn't accepting connections.
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    api:
        build: .
        restart: unless-stopped
        # Load your secrets/config from .env into the container.
        env_file: .env
        environment:
            # CRITICAL: inside the compose network the database host is the SERVICE
            # NAME "db", NOT localhost. This overrides POSTGRES_SERVER from .env so
            # config.py assembles the right DATABASE_URI.
            POSTGRES_SERVER: db
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "8000:8000"
        # Apply migrations, THEN start the server. Both run through uv.
        command: >
            sh -c "uv run --no-sync alembic upgrade head &&
                   uv run --no-sync uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
    postgres_data:
